global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: feature-service
    metrics_path: /metrics
    static_configs:
      - targets: ["feature-service:8080"]

  # The service that scripts/benchmark_feature_serving.py starts on the host.
  # It is DOWN outside of a benchmark run.
  - job_name: feature-service-benchmark
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18080"]
