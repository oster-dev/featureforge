name: user_play_seconds_last2_1h
version: 1
owner: personalization-team
description: Play count and the last two play seconds in the last hour. Reference fixture only.
entity: user_id
source: interaction-events.validated.v1
aggregations:
  - {name: play_count, op: count, filter: "event_type == 'play'"}
  - {name: last_play_seconds, op: last_k, column: play_seconds, k: 2, filter: "event_type == 'play'"}
window: {size: 1h, slide: 1m, boundary: right_closed}
lateness: {watermark_delay: 10m, allowed: 30m}
dedupe: {key: event_id, ttl: 24h}
online: {store: redis, ttl: 2h, update_policy: window_replace}
offline: {store: iceberg, table: features.user_play_seconds_last2_1h}
freshness_slo: 5m
