name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Baseline lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java runtime
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and CI dependencies
        run: python -m pip install -e ".[dev,feature-store,spark,streaming]"

      - name: Verify package import
        run: python -c "import featureforge; print(featureforge.__file__)"

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Ruff lint
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Run baseline test suite
        run: pytest -v -m "not integration" --durations=10

  python-compat:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,feature-store,spark,streaming]"

      - name: Run baseline test suite
        run: pytest -v -m "not integration"

  serving-integration:
    name: Redis and Feast serving integration
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    env:
      BACKFILL_START_DATE: "2026-03-10"
      BACKFILL_END_DATE: "2026-03-12"
      WINDOW_DAYS: "7"
      MATERIALIZE_START_TIME: "2026-03-10T00:00:00+00:00"
      MATERIALIZE_END_TIME: "2026-03-13T00:00:00+00:00"

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0
        ports:
          - 8474:8474
          - 16379:16379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: featureforge
          POSTGRES_PASSWORD: featureforge
          POSTGRES_DB: iceberg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U featureforge -d iceberg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java runtime
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and CI dependencies
        run: python -m pip install -e ".[dev,feature-store,spark,streaming]"

      - name: Verify package import
        run: python -c "import featureforge; print(featureforge.__file__)"

      - name: Verify Redis connection
        run: |
          python - <<'PY'
          import socket
          import time

          for attempt in range(20):
              try:
                  with socket.create_connection(("localhost", 6379), timeout=2):
                      print("Redis is reachable")
                      break
              except OSError:
                  if attempt == 19:
                      raise
                  print(f"Waiting for Redis ({attempt + 1}/20)")
                  time.sleep(2)
          PY

      - name: Generate deterministic source data
        run: |
          featureforge generate \
            --config configs/synthetic_data.yaml \
            --output output/source_data

      - name: Run canonical backfill
        run: |
          featureforge backfill \
            --input output/source_data \
            --output output/offline_store \
            --start-date "$BACKFILL_START_DATE" \
            --end-date "$BACKFILL_END_DATE" \
            --window-days "$WINDOW_DAYS"

      - name: Verify offline feature partitions exist
        run: |
          find output/offline_store -name features.parquet
          test -n "$(find output/offline_store -name 'features.parquet')"

      - name: Show Feast online-store configuration
        working-directory: feature_repo
        run: |
          echo "Feature repository configuration:"
          cat feature_store.yaml

      - name: Apply Feast feature repository
        working-directory: feature_repo
        run: feast apply

      - name: Materialize validated feature values into Redis
        run: |
          featureforge materialize \
            --repo feature_repo \
            --start-time "$MATERIALIZE_START_TIME" \
            --end-time "$MATERIALIZE_END_TIME" \
            --manifest-output output

      - name: Verify materialization manifest exists
        run: |
          find output/materialization_manifests -name "*.json"
          test -n "$(find output/materialization_manifests -name '*.json')"

      - name: Run Redis and unified online integration tests
        env:
          FEATUREFORGE_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest -v -m integration \
            tests/integration/test_streaming_redis_online_store.py \
            tests/integration/test_streaming_redis_online_store_concurrency.py \
            tests/integration/test_unified_online.py \
            tests/integration/test_history_spark_read.py \
            tests/integration/test_history_postgres_catalog.py \
            tests/integration/test_published_spark.py \
            tests/integration/test_training_dataset_published.py \
            tests/integration/test_cli_training_dataset.py \
            tests/integration/test_feature_service_redis.py \
            tests/integration/test_feature_service_faults.py \
            tests/integration/test_online_store_contract.py \
            --junitxml=/tmp/featureforge-streaming-redis.xml

          python - <<'PYTEST_REPORT'
          import xml.etree.ElementTree as ET

          report = ET.parse("/tmp/featureforge-streaming-redis.xml")
          cases = report.findall(".//testcase")
          if not cases:
              raise SystemExit("No Redis or unified online tests recorded.")

          required_suites = (
              "test_streaming_redis_online_store",
              "test_streaming_redis_online_store_concurrency",
              "test_unified_online",
              "test_history_spark_read",
              "test_history_postgres_catalog",
              "test_published_spark",
              "test_training_dataset_published",
              "test_cli_training_dataset",
              "test_feature_service_redis",
              "test_feature_service_faults",
              "test_online_store_contract",
          )
          for suite in required_suites:
              if not any(
                  case.get("classname", "").split(".")[-1] == suite
                  for case in cases
              ):
                  raise SystemExit(f"Missing integration test module: {suite}")

          for outcome in ("skipped", "failure", "error"):
              if report.findall(f".//{outcome}"):
                  raise SystemExit(f"Integration report contains: {outcome}")

          print(f"Verified {len(cases)} integration tests without skips.")
          PYTEST_REPORT

      - name: Run online-serving integration tests
        run: pytest -v tests/integration/test_online_serving.py

      - name: Upload materialization manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: materialization-manifests
          path: output/materialization_manifests/
          retention-days: 7

      - name: Upload offline-store diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-store-diagnostics
          path: output/offline_store/
          retention-days: 7

  cassandra-integration:
    name: Cassandra schema, store and contract suite
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    services:
      cassandra:
        image: cassandra:5.0.9
        env:
          CASSANDRA_CLUSTER_NAME: featureforge
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          CASSANDRA_DC: datacenter1
          CASSANDRA_RACK: rack1
          MAX_HEAP_SIZE: 1G
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE CLUSTER'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 60s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Cassandra integration tests
        env:
          FEATUREFORGE_CASSANDRA_HOST: 127.0.0.1
          FEATUREFORGE_STORE_BACKENDS: cassandra
        run: |
          python -m pytest -v -m integration \
            tests/integration/test_cassandra_node.py \
            tests/integration/test_online_store_contract.py \
            tests/integration/test_serving_reader_cassandra.py \
            --junitxml=/tmp/featureforge-cassandra.xml

          python - <<'PYTEST_REPORT'
          import xml.etree.ElementTree as ET

          report = ET.parse("/tmp/featureforge-cassandra.xml")
          cases = report.findall(".//testcase")
          for suite in (
              "test_cassandra_node",
              "test_online_store_contract",
              "test_serving_reader_cassandra",
          ):
              if not any(
                  case.get("classname", "").split(".")[-1] == suite for case in cases
              ):
                  raise SystemExit(f"Missing integration test module: {suite}")

          contract = [
              case
              for case in cases
              if case.get("classname", "").split(".")[-1] == "test_online_store_contract"
          ]
          if not all("cassandra" in case.get("name", "") for case in contract):
              raise SystemExit("The contract suite did not run for the cassandra backend")

          for outcome in ("skipped", "failure", "error"):
              if report.findall(f".//{outcome}"):
                  raise SystemExit(f"Integration report contains: {outcome}")

          print(f"Verified {len(cases)} Cassandra tests without skips.")
          PYTEST_REPORT

  streaming-flink-integration:
    name: Flink Kafka-to-Redis integration
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45

    env:
      COMPOSE_PROFILES: cassandra
      FEATUREFORGE_REDIS_URL: redis://127.0.0.1:6379/0
      FLINK_REST_URL: http://127.0.0.1:8081

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java runtime
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project, Spark and streaming dependencies
        run: python -m pip install -e ".[dev,spark,streaming]"

      - name: Start streaming stack
        run: docker compose up -d --build

      - name: Wait for streaming services
        run: |
          for service in kafka jobmanager redis cassandra; do
            container="$(docker compose ps -q "$service")"
            test -n "$container" || {
              echo "Missing container for service: $service"
              exit 1
            }

            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi

              if [ "$attempt" = "60" ]; then
                echo "$service did not become healthy"
                docker compose logs "$service" --no-color
                exit 1
              fi

              sleep 2
            done
          done

      - name: Run Flink integration tests with a fresh TaskManager per module
        run: bash scripts/ci/run_flink_integration.sh

      - name: Collect streaming diagnostics on failure
        if: failure()
        run: |
          docker compose ps > streaming-ps.log
          docker compose logs --no-color > streaming-diagnostics.log

      - name: Upload streaming diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-diagnostics
          path: |
            streaming-diagnostics.log
            streaming-ps.log
          retention-days: 7

      - name: Upload streaming test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-junit
          path: reports/
          retention-days: 7

      - name: Stop streaming stack
        if: always()
        run: docker compose down -v