[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featureforge"
version = "0.1.0"
description = "Production-inspired feature platform for reproducible offline training data and low-latency online ML feature serving."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Nico Ostermann" }
]
keywords = [
  "machine-learning",
  "ml-platform",
  "feature-store",
  "feast",
  "pyspark",
  "data-engineering",
  "feature-engineering",
  "mlops"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<20",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.7,<14.0",
]

[project.scripts]
featureforge = "featureforge.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "pre-commit>=3.8,<5.0",
]

feature-store = [
  "feast[redis]>=0.45,<1.0",
]

spark = [
  "pyspark>=3.5,<4.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:feast\\.type_map",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]