[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featureforge"
version = "0.1.0"
description = "Production-inspired feature platform for reproducible offline training data and online ML feature serving."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Nico Ostermann" },
]
keywords = [
  "machine-learning",
  "ml-platform",
  "feature-store",
  "feast",
  "pyspark",
  "data-engineering",
  "feature-engineering",
  "mlops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<20",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.7,<14.0",
]

[project.scripts]
featureforge = "featureforge.cli:main"
featureforge-serve = "featureforge.service_api:main"

[project.optional-dependencies]
cassandra = [
  "cassandra-driver>=3.30,<4.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "pre-commit>=3.8,<5.0",
  "mypy>=1.13,<3.0",
  "types-PyYAML>=6.0,<7.0",
  "pandas-stubs>=2.2",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "psutil>=5.9,<8",
  "cassandra-driver>=3.30,<4.0",
  "prometheus-client>=0.20,<1.0",
]

notebook = [
  "matplotlib>=3.8,<4.0",
  "nbclient>=0.10,<1.0",
  "nbformat>=5.10,<6.0",
  "ipykernel>=6.29,<7.0",
]

serve = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "redis[hiredis]>=4.2.2,<6",
  "prometheus-client>=0.20,<1.0",
]

feature-store = [
  "feast[redis]>=0.45,<1.0",
]

spark = [
  "pyspark>=3.5,<4.0",
]

streaming = [
  "confluent-kafka>=2.6,<3",
  "redis>=4.2.2,<6",
  "pyiceberg[pyarrow,sql-sqlite,sql-postgres,pyiceberg-core]>=0.12,<0.13",
]

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cassandra", "cassandra.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["featureforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires streaming infrastructure"]
filterwarnings = [
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:feast\\.type_map",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]