<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d">
<title id="t">FeatureForge</title>
<desc id="d">Animated overview: one YAML feature spec drives a Flink job, a guarded materializer, an online store on Redis or Cassandra and a serving API that returns a status for every value. Validated events also go to an Iceberg event fact table, accepted updates go to an Iceberg publication history, and both feed training datasets in the modes event_time and published_as_of.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="forge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffd08a"/><stop offset="0.5" stop-color="#ff9a4a"/><stop offset="1" stop-color="#f0603c"/>
  </linearGradient>
  <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9ecbff"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<clipPath id="cardclip"><rect x="2" y="2" width="1276" height="496" rx="17"/></clipPath><rect x="1" y="1" width="1278" height="498" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/><rect x="1" y="1" width="1278" height="498" rx="18" fill="url(#grid)"/>
<g clip-path="url(#cardclip)"><circle cx="1080" cy="70" r="230" fill="url(#glow)"/>
<circle cx="180" cy="470" r="220" fill="url(#glowBlue)"/></g>

<g transform="translate(56,44) scale(1.3181818181818181)">
  <rect x="0" y="0" width="44" height="44" rx="11" fill="#1c2330" stroke="url(#forge)" stroke-width="2"/>
  <path d="M7 15h30v3c-4 0-7 2-8 5h-3v4h6v5H12v-5h6v-4c-1-3-5-5-11-5z" fill="url(#forge)"/>
  <circle cx="34" cy="9" r="2.2" fill="#ffd08a"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<text x="132" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#forge)">FeatureForge</text>
<text x="58" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#e6edf3">An ML feature platform that keeps features correct between offline training and online reads.</text>
<text x="58" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#9da7b3">Point-in-time training datasets  ·  event-time semantics  ·  idempotent writes  ·  a status for every served value  ·  every guarantee links to a test</text>

