<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">Measured serving numbers</title>
<desc id="d">One uvicorn process on one laptop. Redis 7.4 holds 4,000 requests per second with a p99 of 5.1 to 7.3 ms and saturates at 4,600 to 4,900 requests per second. Cassandra 5.0 on one node holds 1,500 requests per second with a p99 of 14.2 to 14.8 ms and saturates at about 2,100 requests per second. Local measurements, not production numbers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="forge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffd08a"/><stop offset="0.5" stop-color="#ff9a4a"/><stop offset="1" stop-color="#f0603c"/>
  </linearGradient>
  <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9ecbff"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.35"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<clipPath id="cardclip"><rect x="2" y="2" width="996" height="426" rx="17"/></clipPath><rect x="1" y="1" width="998" height="428" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/><rect x="1" y="1" width="998" height="428" rx="18" fill="url(#grid)"/>
<text x="56" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Measured, not estimated</text>
<text x="56" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#9da7b3">One uvicorn process · 5 entities per request · 1,000,000 users · 3 runs of 30 s per rate · Apple M4 Pro</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">
  <rect x="560" y="46" width="14" height="14" rx="3" fill="#ff9a4a"/><text x="580" y="58">highest rate with p99 at most 25 ms</text>
  <rect x="800" y="46" width="14" height="14" rx="3" fill="#ff9a4a" fill-opacity="0.3"/><text x="820" y="58">saturation of one process</text>
</g>
<path d="M250,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="250" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">0</text><path d="M348,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="348" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">1,000</text><path d="M446,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="446" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">2,000</text><path d="M544,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="544" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">3,000</text><path d="M642,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="642" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">4,000</text><path d="M740,118 V300" stroke="#ffffff" stroke-opacity="0.07"/><text x="740" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">5,000</text>
<text x="740" y="340" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#6e7681">requests per second</text>
<g>
  <text x="56" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Redis 7.4</text>
  <text x="56" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9da7b3">one MGET, on the event loop</text>
  <rect x="250" y="140" width="490" height="28" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="250" y="140" height="28" rx="6" fill="#ff9a4a" fill-opacity="0.24" width="480">
    <animate attributeName="width" values="0;0;480;480" keyTimes="0;0.030;0.210;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="140" height="28" rx="6" fill="#ff9a4a" width="392">
    <animate attributeName="width" values="0;0;392;392" keyTimes="0;0.030;0.160;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.160;0.210;1" dur="10s" repeatCount="indefinite"/>
    <text x="262" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d1117">4,000 req/s</text>
    <path d="M701,135 V173 M730,135 V173" stroke="#ff9a4a" stroke-width="2"/>
    <text x="764" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ff9a4a">p99 5.1–7.3 ms</text>
    <text x="764" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9da7b3">saturation 4,600–4,900 req/s</text>
  </g>
</g>
<g>
  <text x="56" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Cassandra 5.0</text>
  <text x="56" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9da7b3">one node, one read per entity</text>
  <rect x="250" y="226" width="490" height="28" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="250" y="226" height="28" rx="6" fill="#58a6ff" fill-opacity="0.24" width="206">
    <animate attributeName="width" values="0;0;206;206" keyTimes="0;0.070;0.250;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="226" height="28" rx="6" fill="#58a6ff" width="147">
    <animate attributeName="width" values="0;0;147;147" keyTimes="0;0.070;0.200;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.250;1" dur="10s" repeatCount="indefinite"/>
    <text x="262" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d1117">1,500 req/s</text>
    <path d="M456,221 V259 M456,221 V259" stroke="#58a6ff" stroke-width="2"/>
    <text x="764" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">p99 14.2–14.8 ms</text>
    <text x="764" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9da7b3">saturation about 2,100 req/s</text>
  </g>
</g>
<g>
  <rect x="56" y="346" width="210" height="58" rx="12" fill="#1c2330" stroke="#30363d"/>
  <text x="72" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#3fb950">+21 %</text>
  <text x="72" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">Redis saturation, event-loop read</text>
</g>
<g>
  <rect x="282" y="346" width="210" height="58" rx="12" fill="#1c2330" stroke="#30363d"/>
  <text x="298" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ff9a4a">0.19–0.29 ms</text>
  <text x="298" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">CPU per request, Redis</text>
</g>
<g>
  <rect x="508" y="346" width="210" height="58" rx="12" fill="#1c2330" stroke="#30363d"/>
  <text x="524" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#58a6ff">0.46–0.51 ms</text>
  <text x="524" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">CPU per request, Cassandra</text>
</g>
<g>
  <rect x="734" y="346" width="210" height="58" rx="12" fill="#1c2330" stroke="#30363d"/>
  <text x="750" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#9da7b3">local only</text>
  <text x="750" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9da7b3">a target, not an SLO</text>
</g>
</svg>
