name: featureforge-stream

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  jobmanager:
    image: featureforge-stream-flink:1.20.3
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 30
        restart-strategy.fixed-delay.delay: 3s
        python.client.executable: /opt/pyflink/bin/python
        python.executable: /opt/pyflink/bin/python
    volumes:
      - ./jobs:/opt/flink/jobs:ro
      - ./feature_repo/specs:/opt/flink/specs:ro
      - flink-savepoints:/opt/flink/savepoints
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8081/overview >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  taskmanager:
    image: featureforge-stream-flink:1.20.3
    command: taskmanager
    restart: on-failure
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.host: taskmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 3456m
        taskmanager.memory.jvm-metaspace.size: 768m
        parallelism.default: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 30
        restart-strategy.fixed-delay.delay: 3s
        python.client.executable: /opt/pyflink/bin/python
        python.executable: /opt/pyflink/bin/python
    volumes:
      - ./jobs:/opt/flink/jobs:ro
      - flink-savepoints:/opt/flink/savepoints

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["fault"]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:16379:16379"
    depends_on:
      redis:
        condition: service_healthy

  iceberg-catalog:
    image: postgres:16-alpine
    profiles: ["catalog"]
    environment:
      POSTGRES_USER: featureforge
      POSTGRES_PASSWORD: featureforge
      POSTGRES_DB: iceberg
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - iceberg-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureforge -d iceberg"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  feature-service:
    build:
      context: .
      dockerfile: docker/service/Dockerfile
    image: featureforge-service:0.1.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --redis-url
      - redis://redis:6379/0
      - --specs-dir
      - /app/specs
      - --quiet
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./feature_repo/specs:/app/specs:ro

volumes:
  kafka-data:
  redis-data:
  iceberg-catalog-data:
  flink-savepoints: